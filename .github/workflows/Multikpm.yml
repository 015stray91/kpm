name: Build KSU Next KPM Stack

on:
  push:
    paths:
      - ".github/workflows/build-kpm.yml"
      - "src/**"
  workflow_dispatch:
    inputs:
      version:
        description: 'KPM Stack Build Version'
        required: false
        default: '23040200'

jobs:
  Build-KSU-Next-Stack:
    name: Compile and Package KPM Modules
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up NDK Clang Environment
        uses: Ylarod/setup-ndk-clang@v1
        with:
          ndk-version: r26d

      - name: Verify Clang Version
        run: clang --version

      - name: Step 1 - Compile SUSFS KernelSU Next Module
        run: |
          mkdir -p target
          cd src/susfs/
          # Uses the verified NDK Clang paths to compile your arm64 kernel module
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- KERNEL_VERSION=5.10.218 CONFIG_KSU_NEXT=y CC=clang
          mv *.kpm ../../target/01_susfs_5.10.218.kpm

      - name: Step 2 - Compile ZeroMount KSU Next Module
        run: |
          cd src/zeromount/
          # Matches execution environments and links paths sequentially
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- KERNEL_VERSION=5.10.218 CONFIG_KSU_NEXT=y CC=clang EXTRA_CFLAGS="-DCONFIG_SUSFS_COMPAT=1"
          mv *.kpm ../../target/02_zeromount_5.10.218.kpm

      - name: Upload KPM Output Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kpm-modules-stack-${{ github.event.inputs.version || 'latest' }}
          path: target/*.kpm
          
